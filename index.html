<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legendas traduzidas</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0d141b;
      --panel: #17212b;
      --text: #f3f6f8;
      --muted: #aebbc7;
      --accent: #54a6ff;
      --danger: #ff6b6b;
      --sub-color: #ffffff;
      --sub-size: 30px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .panel {
      margin: 14px 0;
      padding: 16px;
      border: 1px solid #30404e;
      border-radius: 12px;
      background: var(--panel);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    select,
    input,
    button {
      font: inherit;
    }

    select,
    input[type="number"] {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #526474;
      border-radius: 8px;
      color: var(--text);
      background: #101820;
    }

    input[type="color"] {
      width: 100%;
      height: 42px;
      padding: 4px;
      border: 1px solid #526474;
      border-radius: 8px;
      background: #101820;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      color: #07111a;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: #394957;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      min-height: 24px;
      margin-top: 14px;
      color: var(--muted);
      line-height: 1.45;
    }

    #status.error {
      color: var(--danger);
    }

    .stage {
      min-height: 230px;
      display: flex;
      justify-content: center;
      padding: 20px;
      border: 1px solid #30404e;
      border-radius: 12px;
      background: radial-gradient(ellipse at center, #273441 0%, #121b24 72%);
    }

    .stage.position-top {
      align-items: flex-start;
    }

    .stage.position-center {
      align-items: center;
    }

    .stage.position-bottom {
      align-items: flex-end;
    }

    .box {
      width: 100%;
      text-align: center;
    }

    #translated {
      color: var(--sub-color);
      font-size: var(--sub-size);
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 4px #000;
    }

    /* O aviso tem tamanho próprio e não acompanha o tamanho da legenda. */
    #placeholder {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
    }

    #original {
      margin-top: 10px;
      color: #d4dde5;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    #interim {
      min-height: 24px;
      margin-top: 12px;
      color: #b8c4ce;
      font-style: italic;
    }

    .small {
      color: var(--muted);
      font-size: .85rem;
    }

    @media (max-width: 560px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Legendas traduzidas</h1>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="language">Idioma falado</label>
          <select id="language">
            <option value="en-US">Inglês</option>
            <option value="es-ES">Espanhol</option>
            <option value="ja-JP">Japonês</option>
          </select>
        </div>

        <div>
          <label for="targetLanguage">Idioma da legenda</label>
          <select id="targetLanguage">
            <option value="pt">Português</option>
            <option value="en">Inglês</option>
            <option value="es">Espanhol</option>
            <option value="ja">Japonês</option>
          </select>
        </div>

        <div>
          <label for="color">Cor da legenda</label>
          <input id="color" type="color" value="#ffffff">
        </div>

        <div>
          <label for="size">Tamanho: <span id="sizeValue">30</span> px</label>
          <input id="size" type="number" min="16" max="60" value="30">
        </div>

        <div>
          <label for="position">Posição</label>
          <select id="position">
            <option value="bottom">Embaixo</option>
            <option value="center">No meio</option>
            <option value="top">Em cima</option>
          </select>
        </div>

        <div>
          <label for="delay">Atraso da legenda (ms)</label>
          <input id="delay" type="number" min="0" max="10000" step="250" value="0">
        </div>
      </div>

      <div class="buttons">
        <button id="start" type="button">Iniciar microfone</button>
        <button id="stop" class="secondary" type="button" disabled>Parar</button>
        <button id="clear" class="secondary" type="button">Limpar</button>
      </div>

      <div id="status" role="status" aria-live="polite">
        Pronto. Clique em Iniciar microfone.
      </div>
    </section>

    <section id="stage" class="stage position-bottom">
      <div class="box">
        <div id="translated" aria-live="polite"></div>
        <div id="placeholder">A tradução aparecerá aqui.</div>
        <div id="original"></div>
        <div id="interim"></div>
      </div>
    </section>

    <p class="small">Precisa de internet. Mantenha esta página em primeiro plano.</p>
  </main>

  <script>
    (function () {
      'use strict';

      const API_URL =
        'https://script.google.com/macros/s/AKfycbyDkH296gsdx3hd7MOl4BIyWPNS86sts4OatoJJflZ6BnefZMroV_YG-IvCNtJWW49lKw/exec';

      const $ = function (id) {
        return document.getElementById(id);
      };

      const langSel = $('language');
      const targetSel = $('targetLanguage');
      const startBtn = $('start');
      const stopBtn = $('stop');
      const statusBox = $('status');
      const translatedBox = $('translated');
      const placeholderBox = $('placeholder');
      const originalBox = $('original');
      const interimBox = $('interim');

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      let recognition = null;
      let listening = false;
      let restartTimer = null;
      let queue = Promise.resolve();
      let displayTimer = null;
      let requestNumber = 0;

      function setStatus(message, isError) {
        statusBox.textContent = message;
        statusBox.classList.toggle('error', Boolean(isError));
      }

      function setButtons(on) {
        startBtn.disabled = on;
        stopBtn.disabled = !on;
        langSel.disabled = on;
      }

      function show(original, translation) {
        const delay = Math.max(
          0,
          Math.min(10000, Number($('delay').value) || 0)
        );

        clearTimeout(displayTimer);

        displayTimer = setTimeout(function () {
          translatedBox.textContent = translation;
          placeholderBox.hidden = Boolean(translation);
          originalBox.textContent = original;
        }, delay);
      }

      function jsonp(params) {
        return new Promise(function (resolve, reject) {
          const callbackName =
            'captionCallback_' + Date.now() + '_' + (++requestNumber);

          const script = document.createElement('script');
          let finished = false;

          function cleanUp() {
            clearTimeout(timeout);
            script.onerror = null;
            script.remove();

            try {
              delete window[callbackName];
            } catch (e) {
              window[callbackName] = undefined;
            }
          }

          function finish(error, data) {
            if (finished) return;
            finished = true;
            cleanUp();

            if (error) {
              reject(error);
            } else {
              resolve(data);
            }
          }

          window[callbackName] = function (data) {
            finish(null, data);
          };

          const query = new URLSearchParams({
            lang: params.lang,
            target: params.target,
            text: params.text,
            callback: callbackName,
            _: String(Date.now())
          });

          script.async = true;
          script.src = API_URL + '?' + query.toString();
          script.onerror = function () {
            finish(new Error(
              'Não consegui acessar o serviço. Confira a publicação do Apps Script, o endereço e a conexão.'
            ));
          };

          const timeout = setTimeout(function () {
            finish(new Error(
              'O serviço de tradução demorou demais para responder.'
            ));
          }, 30000);

          document.head.appendChild(script);
        });
      }

      function translate(text) {
        const clean = String(text || '').trim();
        if (!clean) return;

        const sourceCode = langSel.value.split('-')[0];
        const targetCode = targetSel.value;

        queue = queue.then(function () {
          setStatus('Traduzindo…', false);

          return jsonp({
            lang: sourceCode,
            target: targetCode,
            text: clean
          }).then(function (data) {
            if (!data || !data.ok) {
              throw new Error(
                data && data.error ? data.error : 'Resposta inválida do serviço.'
              );
            }

            show(data.result.original, data.result.translation);
            setStatus(
              listening ? 'Ouvindo…' : 'Tradução concluída.',
              false
            );
          });
        }).catch(function (error) {
          setStatus(
            'Erro na tradução: ' + (error.message || error),
            true
          );
        });
      }

      function createRecognition() {
        recognition = new SR();
        recognition.lang = langSel.value;
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = function () {
          listening = true;
          setButtons(true);
          setStatus('Ouvindo…', false);
        };

        recognition.onresult = function (event) {
          let interim = '';

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const text = (
              result[0] && result[0].transcript || ''
            ).trim();

            if (!text) continue;

            if (result.isFinal) {
              translate(text);
            } else {
              interim += text + ' ';
            }
          }

          interimBox.textContent = interim.trim();
        };

        recognition.onerror = function (event) {
          const messages = {
            'not-allowed':
              'Microfone bloqueado. Permita o acesso nas configurações do site.',
            'service-not-allowed':
              'Serviço de reconhecimento não permitido pelo navegador.',
            'no-speech':
              'Não detectei fala. Continue falando ou confira o microfone.',
            'network':
              'Problema de rede no reconhecimento de fala.',
            'audio-capture':
              'Não foi possível acessar o microfone.',
            'language-not-supported':
              'Idioma não aceito pelo navegador.'
          };

          setStatus(messages[event.error] || ('Erro: ' + event.error), true);

          if ([
            'not-allowed',
            'service-not-allowed',
            'audio-capture',
            'language-not-supported'
          ].indexOf(event.error) !== -1) {
            listening = false;
            setButtons(false);
          }
        };

        recognition.onend = function () {
          if (listening) {
            clearTimeout(restartTimer);

            restartTimer = setTimeout(function () {
              if (!listening) return;

              try {
                recognition.start();
              } catch (e) {
                // O navegador pode ainda estar encerrando o reconhecimento.
              }
            }, 500);
          } else {
            setButtons(false);
          }
        };
      }

      startBtn.addEventListener('click', function () {
        if (!SR) {
          setStatus(
            'Navegador sem reconhecimento de fala. Use o Chrome atualizado.',
            true
          );
          return;
        }

        try {
          createRecognition();
          recognition.start();
        } catch (e) {
          setStatus('Não consegui iniciar o reconhecimento.', true);
          listening = false;
          setButtons(false);
        }
      });

      stopBtn.addEventListener('click', function () {
        listening = false;
        clearTimeout(restartTimer);

        if (recognition) {
          try {
            recognition.stop();
          } catch (e) {
            // Pode já estar parado.
          }
        }

        setButtons(false);
        interimBox.textContent = '';
        setStatus('Microfone parado.', false);
      });

      $('clear').addEventListener('click', function () {
        translatedBox.textContent = '';
        placeholderBox.hidden = false;
        originalBox.textContent = '';
        interimBox.textContent = '';
        clearTimeout(displayTimer);
      });

      $('color').addEventListener('input', function (event) {
        document.documentElement.style.setProperty(
          '--sub-color',
          event.target.value
        );
      });

      $('size').addEventListener('input', function (event) {
        const size = Math.max(
          16,
          Math.min(60, Number(event.target.value) || 30)
        );

        $('sizeValue').textContent = String(size);
        document.documentElement.style.setProperty(
          '--sub-size',
          size + 'px'
        );
      });

      $('position').addEventListener('change', function (event) {
        const stage = $('stage');
        stage.classList.remove(
          'position-top',
          'position-center',
          'position-bottom'
        );
        stage.classList.add('position-' + event.target.value);
      });

      if (!SR) {
        setStatus(
          'Navegador sem reconhecimento de fala. Use o Chrome atualizado.',
          true
        );
      }
    })();
  </script>
</body>
</html>
